<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보관함 관리자</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#252536;background:#f5f5fa}*{box-sizing:border-box}body{margin:0;padding:26px 14px}.wrap{max-width:850px;margin:auto}.card{background:#fff;border:1px solid #e5e5ef;border-radius:18px;padding:22px;margin-bottom:14px}h1{font-size:27px;margin-top:0}h2{font-size:20px}p,.muted{color:#68687b}.muted{font-size:14px}button{font:inherit;border:1px solid #d7d7e4;border-radius:10px;padding:10px 14px;background:white;cursor:pointer;margin:3px}button.primary{background:#4d55c8;border-color:#4d55c8;color:white}button:disabled{opacity:.55;cursor:not-allowed}input,textarea{font:inherit;width:100%;padding:11px;border:1px solid #d7d7e4;border-radius:10px;margin:6px 0 12px}label{font-weight:600}.row{padding:12px 0;border-bottom:1px solid #eeeef5;overflow-wrap:anywhere}.row:last-child{border:0}.hidden{display:none!important}.status{background:#f1f2ff;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.danger{background:#fff0f0}.actions{display:flex;gap:8px;flex-wrap:wrap}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="wrap">
<section class="card"><h1>보관함 관리자</h1><p>관리자 권한이 등록된 계정만 허용 이메일 목록과 보관함 링크를 수정할 수 있습니다.</p><div id="setup" class="status">Supabase 설정 필요. README를 먼저 확인하세요.</div></section>
<section class="card" id="auth"><h2>관리자 로그인</h2><label for="email">이메일</label><input id="email" type="email" autocomplete="email" placeholder="admin@example.com"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="8자 이상"><div class="actions"><button class="primary" id="login">로그인</button><button id="signup">최초 관리자 계정 만들기</button><button id="logout" class="hidden">로그아웃</button></div><div id="status" class="status">로그인하지 않았어요.</div><p class="muted">처음에는 이 화면에서 본인 계정을 만들고 이메일 확인을 마친 뒤, README에 설명된 SQL로 해당 계정을 관리자에 등록하세요. 그 전까지 관리자 기능은 열리지 않습니다.</p></section>
<div id="panel" class="hidden">
<section class="card"><h2>허용 이메일 목록</h2><p class="muted">한 줄에 이메일 주소 하나씩 입력하세요. 이 목록은 관리자 권한이 확인된 화면에서만 조회·수정할 수 있습니다.</p><label for="allowlist">입장 허용 이메일</label><textarea id="allowlist" rows="8" placeholder="friend@example.com&#10;another@example.com"></textarea><button class="primary" id="saveAllow">허용 목록 저장</button><div id="allowStatus" class="status"></div></section>
<section class="card"><h2>보관함 링크 관리</h2><label for="title">표시 제목</label><input id="title" maxlength="160" placeholder="링크 제목"><label for="url">URL (https://)</label><input id="url" type="url" placeholder="https://example.com"><label for="description">설명 (선택)</label><input id="description" maxlength="500" placeholder="간단한 설명"><button class="primary" id="addLink">링크 추가</button><div id="linkStatus" class="status"></div><div id="linkList"></div></section>
</div></main>
<script>
(() => {
"use strict";
const SUPABASE_URL="https://lfrfpsehwhlcuoxdhhbw.supabase.co", SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const configured=/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL)&&!SUPABASE_URL.includes("YOUR-PROJECT")&&SUPABASE_ANON_KEY!=="YOUR_SUPABASE_ANON_KEY";
const $=id=>document.getElementById(id), status=(id,msg,err=false)=>{$(id).textContent=msg;$(id).classList.toggle("danger",err)};
if(!configured||!window.supabase){$("login").disabled=true;$("signup").disabled=true;status("status","설정 전이라 인증할 수 없습니다. README 설정을 완료해 주세요.",true);return;}
$("setup").classList.add("hidden");const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let admin=false;
const creds=()=>({email:$("email").value.trim().toLowerCase(),password:$("password").value});
$("signup").onclick=async()=>{const {email,password}=creds();if(!$("email").checkValidity()||!email){status("status","올바른 이메일 주소를 입력해 주세요.",true);return;}if(password.length<8){status("status","비밀번호는 8자 이상으로 설정해 주세요.",true);return;}$("signup").disabled=true;status("status","계정을 만들고 있어요…");const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});$("signup").disabled=false;if(error){status("status","가입 실패: "+error.message,true);return;}if(!data.session){status("status","가입 요청을 받았어요. 이메일 확인 링크를 누른 뒤 이 화면에서 로그인하세요. 확인 전에는 관리자 권한이 부여되지 않습니다.");}else{status("status","계정이 만들어졌어요. 관리자 권한을 확인합니다.");await gate();}};
$("login").onclick=async()=>{const {email,password}=creds();if(!$("email").checkValidity()||!email){status("status","올바른 이메일 주소를 입력해 주세요.",true);return;}if(!password){status("status","비밀번호를 입력해 주세요.",true);return;}$("login").disabled=true;status("status","로그인 중…");const {error}=await db.auth.signInWithPassword({email,password});$("login").disabled=false;if(error){status("status","로그인 실패: 이메일 확인 여부와 이메일·비밀번호를 확인해 주세요. ("+error.message+")",true);return;}await gate();};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload();};
async function gate(){const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError){status("status","세션 확인 실패: "+sessionError.message,true);return;}$("login").classList.toggle("hidden",!!session);$("signup").classList.toggle("hidden",!!session);$("logout").classList.toggle("hidden",!session);$("panel").classList.add("hidden");admin=false;if(!session){status("status","관리자 이메일 계정으로 로그인하세요.");return;}const {data:ok,error}=await db.rpc("is_vault_admin");if(error){status("status","관리자 권한 확인 실패. schema.sql과 최초 관리자 등록 단계를 확인하세요: "+error.message,true);return;}if(!ok){status("status","로그인 계정에 관리자 권한이 없습니다. README의 최초 관리자 등록 단계를 완료해 주세요.",true);return;}admin=true;$("panel").classList.remove("hidden");status("status","관리자 인증 완료: "+session.user.email);await loadAllow();await loadLinks();}
async function loadAllow(){const {data,error}=await db.from("allowed_emails").select("email").order("email");if(error){status("allowStatus","목록 읽기 실패: "+error.message,true);return;}$("allowlist").value=(data||[]).map(x=>x.email).join("\n");status("allowStatus",(data||[]).length+"개 이메일을 불러왔어요.");}
$("saveAllow").onclick=async()=>{if(!admin)return;const emails=[...new Set($("allowlist").value.split(/\r?\n/).map(x=>x.trim().toLowerCase()).filter(Boolean))];if(emails.some(x=>!/^\S+@\S+\.\S+$/.test(x)||x.length>254)){status("allowStatus","이메일 주소 형식을 확인해 주세요.",true);return;}const {error:delError}=await db.from("allowed_emails").delete().gte("email","");if(delError){status("allowStatus","기존 목록을 비우지 못했어요: "+delError.message,true);return;}if(emails.length){const {error}=await db.from("allowed_emails").insert(emails.map(email=>({email})));if(error){status("allowStatus","저장 실패: "+error.message,true);await loadAllow();return;}}status("allowStatus","허용 목록 저장 완료 ("+emails.length+"개).");await loadAllow();};
async function loadLinks(){const {data,error}=await db.from("vault_links").select("id,title,url,description").order("created_at",{ascending:false});if(error){status("linkStatus","링크를 불러오지 못했어요: "+error.message,true);return;}$("linkList").replaceChildren();for(const r of data||[]){const el=document.createElement("div");el.className="row";const b=document.createElement("strong");b.textContent=r.title||r.url;el.append(b,document.createElement("br"));const a=document.createElement("a");a.href=r.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=r.url;el.append(a);const d=document.createElement("div");d.textContent=r.description||"";el.append(d);const del=document.createElement("button");del.textContent="삭제";del.onclick=async()=>{if(!confirm("이 링크를 삭제할까요?"))return;const {error}=await db.from("vault_links").delete().eq("id",r.id);if(error)status("linkStatus","삭제 실패: "+error.message,true);else{status("linkStatus","삭제했습니다.");await loadLinks();}};el.append(del);$("linkList").append(el);}if(!(data||[]).length)$("linkList").textContent="등록된 링크가 없어요.";}
$("addLink").onclick=async()=>{if(!admin)return;const title=$("title").value.trim(),url=$("url").value.trim(),description=$("description").value.trim();try{const parsed=new URL(url);if(parsed.protocol!=="https:")throw Error("https 주소를 입력해 주세요.");}catch(e){status("linkStatus","올바른 https:// URL을 입력해 주세요.",true);return;}if(!title){status("linkStatus","제목을 입력해 주세요.",true);return;}const {error}=await db.from("vault_links").insert({title,url,description});if(error){status("linkStatus","추가 실패: "+error.message,true);return;}$("title").value="";$("url").value="";$("description").value="";status("linkStatus","링크를 추가했습니다.");await loadLinks();};
db.auth.onAuthStateChange(()=>{setTimeout(()=>gate(),0);});gate();
})();
</script></body></html>
